<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Monster Lab — RENE SHOOTER seawater creatures</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1c26;font-family:ui-sans-serif,system-ui,sans-serif;color:#eaf6ff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #panel{position:fixed;top:12px;left:12px;max-width:340px;background:rgba(6,24,36,.82);border:1px solid rgba(140,220,255,.35);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px);font-size:13px;line-height:1.45}
  #panel h1{font-size:15px;margin:0 0 2px;letter-spacing:.04em}
  #panel h1 b{color:#ffd23a}
  #panel .sub{opacity:.75;font-size:12px;margin-bottom:8px}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;align-items:center}
  .lbl{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.65;margin-top:6px}
  button{background:#12405c;color:#eaf6ff;border:1px solid rgba(140,220,255,.4);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
  button:hover{background:#1a5a82}
  button.on{background:#ffd23a;color:#1a1400;border-color:#ffd23a;font-weight:700}
  button.warn{background:#7a2a1e;border-color:#ff9a7a}
  input[type=range]{flex:1}
  #stats{position:fixed;top:12px;right:12px;background:rgba(6,24,36,.82);border:1px solid rgba(140,220,255,.35);border-radius:12px;padding:10px 14px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
  #stats b{color:#7dd3fc;font-size:17px}
  #err{position:fixed;left:12px;bottom:12px;right:12px;background:#5c1414;color:#ffe1e1;border-radius:8px;padding:10px 14px;font-size:13px;display:none;white-space:pre-wrap;z-index:9}
  #legend{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(6,24,36,.7);border-radius:999px;padding:6px 16px;font-size:12px;letter-spacing:.05em;white-space:nowrap}
  label.chk{display:inline-flex;gap:4px;align-items:center;font-size:12px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>MONSTER <b>LAB</b></h1>
  <div class="lbl">Kind</div>
  <div class="row" id="kindRow"></div>
  <div id="kindName" style="font-weight:700;color:#7dd3fc"></div>
  <div class="lbl">State (selected)</div>
  <div class="row" id="stateRow"></div>
  <div class="row">
    <button id="hitBtn">Hit (boil point)</button>
    <button id="deathBtn" class="warn">Death</button>
    <button id="resetBtn">Reset line-up</button>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="seaChk"/> in sea</label>
    <label class="chk"><input type="checkbox" id="sunChk" checked/> in sun</label>
  </div>
  <div class="lbl">Coral shield (WARDEN)</div>
  <div class="row"><input type="range" id="shieldRange" min="0" max="100" value="100"/><span id="shieldVal">100%</span></div>
  <div class="lbl">Camera</div>
  <div class="row" id="camRow">
    <button data-cam="orbit" class="on">Orbit</button>
    <button data-cam="close">FP close (3 m)</button>
    <button data-cam="fp8">FP line-up 8 m</button>
    <button data-cam="fp30">FP line-up 30 m</button>
    <button id="conceptBtn">Concept backdrop</button>
  </div>
  <div class="lbl">Load test</div>
  <div class="row">
    <button id="stressBtn">30 creatures: off</button>
    <button id="emptyBtn">Hide all (empty scene)</button>
  </div>
</div>
<div id="stats"><b id="fps">—</b> fps · <b id="ms">—</b> ms<br/><span id="draws"></span></div>
<div id="legend">Line-up left → right: DROPLET · TIDE BRUTE · JETTER · SURFER · GUSHER · PUDDLER · CORAL WARDEN · RAIN SHAMAN</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { createWaterCreature, CREATURES } from '../src/enemies/waterCreature.js';

const errBox = document.getElementById('err');
addEventListener('error', (e) => { errBox.style.display = 'block'; errBox.textContent = 'Error: ' + e.message; });
addEventListener('unhandledrejection', (e) => { errBox.style.display = 'block'; errBox.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });

const params = new URLSearchParams(location.search);
let conceptMode = params.get('backdrop') === 'concept';
let paused = false;
let autoRender = true;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false; // static casters; refreshed on load + stress toggle
renderer.shadowMap.needsUpdate = true;
renderer.transmissionResolutionScale = 0.25; // reduced-res refraction target (see waterCreature.js)
window.__renderer = renderer;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f2, 55, 160);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 400);
camera.position.set(5.5, 3.2, 10.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.1, 0);
controls.maxPolarAngle = Math.PI * 0.52;

// sky HDRI: background + image-based light
const pmrem = new THREE.PMREMGenerator(renderer);
new HDRLoader().load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_48d_partly_cloudy_puresky_1k.hdr',
  (tex) => {
    tex.mapping = THREE.EquirectangularReflectionMapping;
    if (!conceptMode) scene.background = tex;
    window.__sky = tex;
    scene.environment = pmrem.fromEquirectangular(tex).texture;
    window.__hdriReady = true;
  },
  undefined,
  (e) => { errBox.style.display = 'block'; errBox.textContent = 'HDRI failed to load: ' + e.message; }
);

// sun
const sun = new THREE.DirectionalLight(0xfff2d8, 3.4);
sun.position.set(16, 24, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 4; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0xe8d9ae, 0.35));

// ----- code-drawn ground/sea textures -----
function makeTex(size, draw, rx = 1, ry = 1) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sandTex = makeTex(512, (g, S) => {
  g.fillStyle = '#ecd9a4'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = rnd() > 0.5 ? 'rgba(196,162,96,0.35)' : 'rgba(255,246,214,0.4)';
    g.fillRect(rnd() * S, rnd() * S, 1.6, 1.6);
  }
  g.strokeStyle = 'rgba(190,158,96,0.18)';
  for (let i = 0; i < 30; i++) {
    g.beginPath(); const y = rnd() * S; g.moveTo(0, y);
    for (let x = 0; x <= S; x += 32) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 5);
    g.stroke();
  }
}, 46, 46);
const sand = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 90),
  new THREE.MeshStandardMaterial({ map: sandTex, roughness: 0.96, color: 0xf3e5bb }));
sand.rotation.x = -Math.PI / 2; sand.position.z = 22;
sand.receiveShadow = true;
scene.add(sand);

seed = 9;
const seaBump = makeTex(256, (g, S) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 500; i++) {
    const gr = g.createRadialGradient(rnd() * S, rnd() * S, 1, rnd() * S, rnd() * S, 12 + rnd() * 26);
    gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
  }
}, 30, 18);
seaBump.colorSpace = THREE.NoColorSpace;
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(260, 110),
  new THREE.MeshStandardMaterial({ color: 0x177e9e, roughness: 0.16, metalness: 0, bumpMap: seaBump, bumpScale: 0.9, envMapIntensity: 1.15 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.07, -62);
sea.receiveShadow = true;
scene.add(sea);
// foam shoreline band
const foamBand = new THREE.Mesh(
  new THREE.PlaneGeometry(260, 3.4),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false }));
foamBand.rotation.x = -Math.PI / 2; foamBand.position.set(0, 0.09, -6.8);
scene.add(foamBand);

// beach props (scale + something high-contrast to see refraction bend)
{
  const grey = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.85 });
  [[-9, -3.4, 0.9], [8.6, -3.8, 1.2], [12.5, -2.6, 0.7], [-13, -3, 1.4]].forEach(([x, z, s], i) => {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), grey);
    rock.position.set(x, s * 0.45, z); rock.rotation.set(i * 1.3, i * 2.1, 0.4);
    rock.castShadow = rock.receiveShadow = true;
    scene.add(rock);
  });
  const stripeTex = makeTex(128, (g, S) => {
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#e23b2e' : '#fdfdf8'; g.fillRect(i * S / 8, 0, S / 8, S); }
  }, 3, 1);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.6, 10),
    new THREE.MeshStandardMaterial({ color: 0xd8d3c8, roughness: 0.4, metalness: 0.6 }));
  pole.position.set(1.8, 1.3, -3.1); pole.castShadow = true; scene.add(pole);
  const canopy = new THREE.Mesh(new THREE.ConeGeometry(1.7, 0.55, 18, 1, true),
    new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.7, side: THREE.DoubleSide }));
  canopy.position.set(1.8, 2.62, -3.1); canopy.castShadow = true; scene.add(canopy);
  const buoy = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.15, 12, 24),
    new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.45 }));
  buoy.position.set(-4.6, 0.5, -3.3); buoy.rotation.y = 0.4; buoy.castShadow = true; scene.add(buoy);
}

// Batch static props so the shared transmission prepass stays within the lab budget.
{
  const props=scene.children.filter(o=>o.isMesh && o!==sand && o!==sea && o!==foamBand);
  for(const mapped of [false,true]) {
    const list=props.filter(o=>!!o.material.map===mapped),geometries=[];
    for(const o of list) {
      o.updateMatrixWorld();const g=(o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone()).applyMatrix4(o.matrixWorld);
      if(!mapped){const a=new Float32Array(g.attributes.position.count*3),c=o.material.color;for(let i=0;i<a.length;i+=3){a[i]=c.r;a[i+1]=c.g;a[i+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));}
      geometries.push(g);o.removeFromParent();o.geometry.dispose();
    }
    const material=mapped?list[0].material:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.75});
    const mesh=new THREE.Mesh(mergeGeometries(geometries),material);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);
    for(const g of geometries)g.dispose();
  }
}

// A neutral disc keeps contact and refraction visible beside the concept sheet.
const beachObjects = scene.children.filter(o => o.isMesh);
const conceptDisc = new THREE.Mesh(new THREE.CircleGeometry(5, 96),
  new THREE.MeshStandardMaterial({ color: 0x333639, roughness: .72 }));
conceptDisc.rotation.x = -Math.PI / 2;
conceptDisc.position.y = -.003;
conceptDisc.visible = false;
scene.add(conceptDisc);

// ----- creatures -----
const SPACING = 3.4;
let lineup = [];
let stressSet = [];
let selected = 1;
let selState = 'idle';
let stressOn = false;
let hidden = false;

const shieldRange = document.getElementById('shieldRange');

function makeLineup() {
  for (const c of lineup) c.dispose();
  lineup = CREATURES.map((def, i) => {
    const c = createWaterCreature(i);
    c.group.position.set((i - 3.5) * SPACING, 0, 0);
    scene.add(c.group);
    return c;
  });
  applyShield();
}
function setStress(on) {
  stressOn = on;
  for (const c of stressSet) c.dispose();
  stressSet = [];
  if (on) {
    for (let i = 0; i < 22; i++) {
      const c = createWaterCreature(i % 8);
      const row = Math.floor(i / 8);
      c.group.position.set(-17.5 + (i % 8) * 5 + (row % 2) * 2.2, 0, -4.5 - row * 4.6 + (i % 3) * 0.8); // horde coming out of the surf
      c.group.rotation.y = ((i * 37) % 10 - 5) * 0.06;
      scene.add(c.group);
      stressSet.push(c);
    }
  }
  renderer.shadowMap.needsUpdate = true;
  document.getElementById('stressBtn').textContent = '30 creatures: ' + (on ? 'on' : 'off');
  document.getElementById('stressBtn').classList.toggle('on', on);
  applyHidden();
}
function applyHidden() {
  for (const c of [...lineup, ...stressSet]) c.group.visible = !hidden;
  for (let i=0;i<lineup.length;i++) lineup[i].group.visible = !hidden && (!conceptMode || i===selected);
  for (const c of stressSet) c.group.visible = !hidden && !conceptMode;
}
makeLineup();

// ----- UI -----
const kindRow = document.getElementById('kindRow');
CREATURES.forEach((def, i) => {
  const b = document.createElement('button');
  b.textContent = def.name.split(' ')[0] === def.name ? def.name : def.name;
  b.title = def.name;
  b.onclick = () => setKind(i);
  kindRow.appendChild(b);
});
const stateRow = document.getElementById('stateRow');
['idle', 'walk', 'windup', 'attack', 'hurt'].forEach((s) => {
  const b = document.createElement('button');
  b.textContent = s; b.dataset.state = s;
  b.onclick = () => setState(s);
  stateRow.appendChild(b);
});
function setKind(i) {
  selected = i;
  document.getElementById('kindName').textContent =
    `${i} · ${CREATURES[i].name} — scale ${CREATURES[i].s}, hit radius ${lineup[i].radius.toFixed(2)} m`;
  [...kindRow.children].forEach((b, k) => b.classList.toggle('on', k === i));
  conceptDisc.position.x = lineup[i].group.position.x;
  applyHidden();
  if (camMode !== 'orbit') applyCam();
  if (conceptMode) conceptView();
}
function setState(s) {
  selState = s;
  [...stateRow.children].forEach((b) => b.classList.toggle('on', b.dataset.state === s));
}
document.getElementById('hitBtn').onclick = () => doHit();
document.getElementById('deathBtn').onclick = () => lineup[selected].startDeath();
document.getElementById('resetBtn').onclick = () => { makeLineup(); applyHidden(); setKind(selected); };
document.getElementById('stressBtn').onclick = () => setStress(!stressOn);
document.getElementById('emptyBtn').onclick = (e) => {
  hidden = !hidden; applyHidden();
  e.target.textContent = hidden ? 'Show all' : 'Hide all (empty scene)';
  e.target.classList.toggle('on', hidden);
};
function doHit() {
  const c = lineup[selected];
  const p = c.group.localToWorld(new THREE.Vector3(0.12, 0.85, 0.42));
  c.hit(p, 1.6);
}
function applyShield() {
  const f = shieldRange.value / 100;
  document.getElementById('shieldVal').textContent = shieldRange.value + '%';
  if (lineup[6]) lineup[6].setShield(f);
}
shieldRange.oninput = applyShield;

let camMode = 'orbit';
function applyCam() {
  const sel = lineup[selected].group.position;
  controls.enabled = camMode === 'orbit';
  camera.fov = 62; camera.updateProjectionMatrix();
  if (camMode === 'close') {
    camera.position.set(sel.x + 0.9, 1.65, sel.z + 3.1);
    camera.lookAt(sel.x, 1.0, sel.z);
  } else if (camMode === 'fp8') {
    camera.fov=88;camera.updateProjectionMatrix();
    camera.position.set(0, 1.65, 8);
    camera.lookAt(0, 1.15, 0);
  } else if (camMode === 'fp30') {
    camera.fov=50;camera.updateProjectionMatrix();
    camera.position.set(0, 1.65, 30);
    camera.lookAt(0, 1.3, 0);
  }
  [...document.getElementById('camRow').children].forEach((b) =>
    b.classList.toggle('on', b.dataset.cam === camMode));
}
document.getElementById('camRow').addEventListener('click', (e) => {
  if (e.target.dataset.cam) { camMode = e.target.dataset.cam; applyCam(); }
});
function conceptView(yaw = .95, elevation = .18, distance = 5.2, targetY) {
  const p = lineup[selected].group.position;
  const height = selected===1 ? 3.7 : selected===7 ? 2.8 : selected===2 ? 2.1 : 1.6;
  const cy = targetY === undefined ? height*.48 : targetY;
  camera.fov = 37; camera.updateProjectionMatrix();
  controls.target.set(p.x,cy,p.z);
  camera.position.set(p.x+Math.sin(yaw)*distance,cy+Math.sin(elevation)*distance,p.z+Math.cos(yaw)*distance);
  camera.lookAt(controls.target);controls.update();
}
function setConcept(on) {
  conceptMode=on;
  for (const o of beachObjects) o.visible=!on;
  conceptDisc.visible=on;
  scene.background=on?new THREE.Color(0x505358):window.__sky;
  scene.fog=on?null:new THREE.Fog(0xcfe8f2,55,160);
  document.getElementById('panel').style.display=on?'none':'';
  document.getElementById('legend').style.display=on?'none':'';
  document.getElementById('stats').style.display=on?'none':'';
  if(on)conceptView(.95,.16,selected===1?9:selected===7?6.5:5.2);
  else {camera.fov=62;camera.updateProjectionMatrix();applyCam();}
  applyHidden();
}
document.getElementById('conceptBtn').onclick=()=>setConcept(!conceptMode);
addEventListener('keydown',e=>{if(e.key==='Escape'&&conceptMode)setConcept(false);});
setKind(selected);
setState('idle');
setConcept(conceptMode);

// ----- URL params + scriptable API (used by the Playwright harness) -----
window.__lab = {
  ready: false,
  setKind, setState,
  hit: doHit,
  death: () => lineup[selected].startDeath(),
  reset: () => { makeLineup(); applyHidden(); setKind(selected); },
  setCam: (m) => { camMode = m; applyCam(); },
  setStress, setConcept, setView: conceptView,
  setAutoRender: (v) => { autoRender=v; },
  pause: (v=true) => { paused=v; },
  step: (seconds) => { for(let i=0;i<Math.ceil(seconds*60);i++) advance(1/60); renderer.render(scene,camera); },
  render: () => renderer.render(scene,camera),
  isolate: (kind) => { for(let i=0;i<lineup.length;i++)lineup[i].group.visible=i===kind;for(const c of stressSet)c.group.visible=false; },
  inspect: () => lineup.map(c=>({radius:c.radius,meshes:c.group.children.length,body:c.group.children[0].children[0].morphTargetInfluences[0],scale:c.group.children[0].scale.toArray()})),
  setShield: (f) => { shieldRange.value = Math.round(f * 100); applyShield(); },
  setHidden: (h) => { hidden = h; applyHidden(); },
  counts: () => ({ lineup: lineup.length, stress: stressSet.length, total: lineup.length + stressSet.length }),
  radii: () => lineup.map((c) => +c.radius.toFixed(3)),
};
if (params.get('kind')) setKind(+params.get('kind'));
if (params.get('state')) setState(params.get('state'));
if (params.get('cam')) { camMode = params.get('cam'); applyCam(); }
if (params.get('stress') === '1') setStress(true);
if (params.get('empty') === '1') { hidden = true; applyHidden(); }
if (params.get('panel') === '0') {
  document.getElementById('panel').style.display = 'none';
  document.getElementById('legend').style.display = 'none';
  document.getElementById('stats').style.display = 'none';

}

// ----- main loop -----
let lastNow = performance.now() / 1000, elapsed = 0;
let emaMs = 16, statT = 0;
const fpsEl = document.getElementById('fps'), msEl = document.getElementById('ms'), drawsEl = document.getElementById('draws');
function frame() {
  requestAnimationFrame(frame);
  if(!autoRender)return;
  const t0 = performance.now();
  const nowS = performance.now() / 1000;
  const dt = Math.min(nowS - lastNow, 0.05);
  lastNow = nowS;
  advance(paused ? 0 : dt);
  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
  const ms = performance.now() - t0;
  emaMs += (ms - emaMs) * 0.05;
  statT += dt;
  if (statT > 0.25) {
    statT = 0;
    fpsEl.textContent = (1000 / Math.max(emaMs, 0.01)).toFixed(0);
    msEl.textContent = emaMs.toFixed(2);
    drawsEl.textContent = `${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris`;
  }
  window.__lab.ready = true;
}
const opts={speed:0,state:'idle',inSea:false,inSun:true};
function advance(dt) {
  elapsed += dt;
  const t = elapsed;
  const inSea = document.getElementById('seaChk').checked;
  const inSun = document.getElementById('sunChk').checked;
  for (let i = 0; i < lineup.length; i++) {
    if (!lineup[i].group.visible) continue;
    const isSel = i === selected;
    opts.speed=isSel&&selState==='walk'?3.2:0;opts.state=isSel?selState:'idle';
    opts.inSea=isSel?inSea:false;opts.inSun=isSel?inSun:true;
    lineup[i].update(dt,t,opts);
  }
  for (let i = 0; i < stressSet.length; i++) {
    const c = stressSet[i];
    if (!c.group.visible) continue;
    opts.speed=i%3===0?2.6:0;opts.state=i%3===0?'walk':'idle';opts.inSea=c.group.position.z < -4;opts.inSun=true;
    c.update(dt,t,opts);
  }
  seaBump.offset.x = t * 0.016; seaBump.offset.y = t * 0.011;
  foamBand.position.z = -6.8 + Math.sin(t * 0.55) * 0.7;
  foamBand.material.opacity = 0.4 + Math.sin(t * 0.55) * 0.15;
}
frame();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
